<section class="pagina"><div class="w"><p class="kicker">Demo</p><h1>Agende un diagnóstico de 30 minutos</h1><p class="lead">Revisamos qué información tiene su sistema y qué tableros podría activar. Sin compromiso.</p></div></section>
<section class="s"><div class="w" style="max-width:820px"><form class="f" id="demo-form" novalidate>
<div><label for="nombre">Nombre</label><input id="nombre" name="nombre" autocomplete="name" required></div>
<div><label for="cargo">Cargo</label><input id="cargo" name="cargo" autocomplete="organization-title" required></div>
<div><label for="ips">IPS</label><input id="ips" name="ips" autocomplete="organization" required></div>
<div><label for="nit">NIT</label><input id="nit" name="nit" inputmode="numeric" placeholder="900123456-7" required></div>
<div><label for="ciudad">Ciudad</label><input id="ciudad" name="ciudad" autocomplete="address-level2" required></div>
<div><label for="sedes">Número de sedes</label><input id="sedes" name="sedes" inputmode="numeric" required></div>
<div class="full"><label for="his">HIS que usa</label><select id="his" name="his" required><option value="">Seleccione</option><option>SaludIPS</option><option>Otro</option></select></div>
<div><label for="correo">Correo</label><input id="correo" name="correo" type="email" autocomplete="email" required></div>
<div><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" autocomplete="tel" required></div>
<div class="hp" aria-hidden="true"><label>No lo llene<input name="sitio_web" tabindex="-1" autocomplete="off"></label></div>
<label class="chk full"><input type="checkbox" name="autoriza" value="1"><span>Autorizo el tratamiento de mis datos personales para contactarme sobre esta solicitud, según la <a href="/legal/privacidad.html">política de privacidad</a>. (Obligatorio)</span></label>
<label class="chk full"><input type="checkbox" name="comunicaciones" value="1"><span>Quiero recibir comunicaciones comerciales de IAnalitica. (Opcional)</span></label>
<div class="full"><button class="btn btn-p" type="submit">Solicitar demo</button></div><div class="full msg" id="demo-msg" role="status" aria-live="polite"></div></form></div></section>
